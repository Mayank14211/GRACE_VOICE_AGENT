# GRACE settings — copy to settings.yaml and edit. settings.yaml is git-ignored.
#
#   copy settings.example.yaml settings.yaml
#
# Every option is optional: anything you leave out keeps the default shown here.
# Unknown or misspelled options are rejected at startup with a clear message.
# API KEYS NEVER GO IN THIS FILE. They live in .env (see .env.example).

# Speech language. en = English (offline STT). hi / auto need a cloud or Whisper STT (Phase 2).
language: en

# Demo mode (S10). It does not change the LLM router: the router is cloud-only (Groq, Gemini,
# OpenRouter); fixed commands, gestures and hotkeys work without network either way.
demo_mode: false

# Global hotkeys (the PRIMARY toggles; voice equivalents are never relied on).
# Format: modifiers and key joined with "+", lower case, e.g. ctrl+alt+m. Must all be different.
hotkeys:
  mic_toggle: ctrl+alt+m        # microphone listening on/off
  gesture_toggle: ctrl+alt+g    # gesture control on/off
  push_to_talk: ctrl+alt+space  # hold to talk
  panic_stop: ctrl+alt+q        # stop all input and release the mouse; app stays alive
  confirm: ctrl+alt+y           # confirm a pending risky action (shutdown, restart, send...)
  history: ctrl+alt+h           # show/hide the conversation history panel
  mark_wrong: ctrl+alt+x        # mark the last action as wrong (metrics)

runtime:
  # python -m grace: voice + gestures + hotkeys + overlay in one process.
  mic_on_at_start: true       # Ctrl+Alt+M toggles it
  gestures_on_at_start: false # Ctrl+Alt+G toggles it; the camera is only open while it is on
  mic_button: true            # clickable mic on/off button next to the status chip (never takes focus)
  gesture_button: true        # clickable camera on/off button left of the mic button
  wake_word: listen           # spoken wake word until a wake-word model exists (see wakeword:)
  overlay: true               # subtitle bar + status chip (false = console only)
  subtitle_fade_s: 4.0        # the subtitle fades this long after the last line
  history_turns: 10           # dialogue turns kept for the history panel (Ctrl+Alt+H)
  earcons: true               # short tones when a hotkey toggles something
  metrics: true               # JSONL events in logs/metrics/ (toggles, actions, CPU, marked wrong)
  cpu_sample_s: 60.0          # how often CPU use is logged

inference:
  # CPU threads for local models (speech to text). 1-8.
  # 4 on the Intel i5-12450H (P-cores only), 6 on the AMD Ryzen 5 5500U.
  # Never use the logical-thread count (12). Benchmark with scripts/bench_threads.py.
  threads: 4

audio:
  # One microphone stream; Silero VAD (models/vad/silero_vad.onnx) finds where speech starts/ends.
  # Download the models once: uv run python scripts/fetch_models.py
  sample_rate: 16000      # fixed: wake word, VAD and STT models expect 16 kHz mono
  input_device: null      # null = system default mic; or a sounddevice index / name substring
  vad_threshold: 0.5      # Silero VAD speech probability (0-1); raise it in noisy rooms
  end_of_speech_ms: 500   # silence that ends an utterance (100-5000 ms); lower = faster replies
  max_utterance_s: 12.0   # hard cap on one command (seconds)
  dictation_max_s: 30.0   # hard cap on one dictated sentence (seconds)
  pre_roll_ms: 300        # audio kept from just before speech started, so first words aren't cut
  min_speech_ms: 200      # utterances with less speech than this (clicks, coughs) are ignored

wakeword:
  # enabled + model file present: openWakeWord with the team's model (see docs/wakeword.md).
  # enabled + no model file yet:  say runtime.wake_word ("listen ...") instead; transcribed offline.
  # enabled: false:               while the mic is on, everything you say is a command.
  # Ctrl+Alt+M (mic) and Ctrl+Alt+Space (push-to-talk) always work, with or without a wake word.
  enabled: true
  model_path: models/wakeword/grace.onnx # openWakeWord model, relative to the repo root
  threshold: 0.5                         # detection score (0-1); lower = more sensitive
  patience: 2                            # 80 ms frames in a row above threshold (1-20)
  follow_up_s: 10.0                      # keep listening for follow-ups this long after a command
                                         # (0 = wake word before every command)

stt:
  # Speech to text. auto: English -> moonshine (offline, streaming).
  # Hindi / auto language, or dictation with dictation_accurate -> groq when GROQ_API_KEY is set
  # and online, else whisper_local (needs: uv sync --extra stt-whisper).
  engine: auto                    # auto | moonshine | whisper_local | groq
  moonshine_model: small-streaming  # tiny-streaming (fastest) | small-streaming | medium-streaming
  update_interval_s: 0.3          # how often the partial text on the overlay refreshes
  whisper_model: base             # faster-whisper model: tiny | base | small (int8, beam 1)
  dictation_accurate: false       # true = dictate with groq / whisper_local instead of moonshine
  groq_model: whisper-large-v3-turbo
  groq_timeout_s: 8.0             # per request; on failure GRACE falls back to whisper_local
  partials: true                  # show what you are saying on the overlay while you speak

gestures:
  # Try them without the full app: uv run python -m grace.input.gestures --dry-run
  camera_index: 0         # webcam index (0 = default camera)
  frame_width: 640        # camera resolution requested (lower = faster tracking)
  frame_height: 480
  model_complexity: 1     # MediaPipe Hands model: 0 = faster, 1 = more accurate
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.6
  # Pose -> behaviour. Poses you leave out keep the default below; "none" turns a pose off.
  # Poses: open_palm, fist, index_up, two_up (index+middle), three_up (index+middle+ring),
  #        thumb_index_middle, pinch_index (thumb on index tip), pinch_middle (thumb on middle tip)
  # Behaviours: cursor, left_click (hold = drag), right_click, scroll, volume, brightness,
  #             pause (hold pause_hold_ms to pause/resume), neutral (resets entry points), none
  map:
    index_up: cursor
    pinch_index: left_click
    pinch_middle: right_click
    two_up: scroll
    three_up: brightness
    thumb_index_middle: volume
    fist: pause
    open_palm: neutral
  hold_frames: 4          # frames a pose must hold before it activates (1-30)
  drag_hold_ms: 400       # pinch held longer than this starts a drag instead of a click
  pause_hold_ms: 1000     # fist held this long pauses / resumes gestures
  pinch_on: 0.22          # pinch starts when thumb-fingertip distance / hand size drops below this
  pinch_off: 0.32         # ...and ends when it rises above this (must be larger: hysteresis)
  deadzone: 0.05          # scroll / volume / brightness ignore offsets smaller than this (0-0.5)
  active_box_margin: 0.15 # frame margin excluded from the cursor box on each side (0-0.5)
  # Speed per unit of hand offset beyond the deadzone (offset is a fraction of the frame height):
  scroll_speed: 60.0      # wheel notches per second
  volume_speed: 200.0     # volume points per second
  brightness_speed: 200.0 # brightness points per second
  max_os_calls_per_s: 10.0  # cap on scroll / volume / brightness calls (1-10)
  cursor_min_cutoff: 1.0  # One Euro filter: lower = steadier cursor when the hand is still
  cursor_beta: 10.0       # One Euro filter: higher = less lag when the hand moves fast

router:
  # The LLM fallback for whatever the fixed commands and follow-ups don't match.
  # Cloud only (2026-11-26): groq first, then gemini, then openrouter. A provider without its
  # key in .env is skipped. Fixed commands never call an LLM. The router keeps the conversation
  # itself and sends it on every call, so any provider can take over mid-conversation.
  provider_order: [groq, gemini, openrouter]
  cloud_timeout_s: 3.0    # per-request timeout (each provider can override it below)
  max_retries: 1          # retries on network errors / 5xx (0-3); never on 429 or timeouts
  cooldown_s: 60.0        # after an HTTP 429, timeout or error, skip that provider for this long
  history_turns: 6        # user + GRACE exchanges sent as context (0 = no memory)
  memory_reset_s: 600.0   # forget the conversation after this long without a command (0 = never)
  followup_s: 120.0       # "a bit more" / "undo that" refer to the last action for this long
  max_tokens: 300         # longest reply the model may write
  temperature: 0.2        # lower = more predictable tool choice
  analysis_timeout_s: 15.0  # "analyze this code" (never sent to Gemini: screen text stays away)
  # Model IDs change: re-check them in each provider's docs (dates in grace/config.py).
  groq:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-20b
    reasoning_effort: low  # none | minimal | low | medium | high | null (not sent)
    timeout_s: null        # seconds; null = cloud_timeout_s
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-3.5-flash-lite
    reasoning_effort: low
    timeout_s: null        # free tier took 1.4-3.5 s here; try 6.0 if it times out
  openrouter:
    base_url: https://openrouter.ai/api/v1
    model: google/gemma-4-26b-a4b-it:free  # must be a ":free" model (zero running cost)
    reasoning_effort: null
    timeout_s: null
  # Free-tier limits per provider (for its model above). GRACE warns at 80 % and skips the
  # provider at 100 % until the minute / UTC day resets. null = not limited by GRACE.
  # Counts survive restarts (logs/quota.json).
  quota:
    groq:        # console.groq.com/settings/limits shows your own limits
      rpm: 30
      rpd: 1000
      tpm: 8000
      tpd: 200000
    gemini:      # per project, visible only in AI Studio: fill these in from there
      rpm: null
      rpd: null
      tpm: null
      tpd: null
    openrouter:  # :free models: 20 per minute, 50 per day without bought credits
      rpm: 20
      rpd: 50
      tpm: null
      tpd: null

images:
  # "Draw a picture of ..." -> Cloudflare Workers AI FLUX.1 [schnell], run by GRACE's own code.
  # Needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN (Workers AI permission) in .env.
  # Free: 10,000 neurons a day (00:00 UTC reset); one image at 4 steps counts ~58 neurons.
  # Prompts asking for sexual content, gore, self-harm or hate are refused on this machine.
  enabled: true
  model: "@cf/black-forest-labs/flux-1-schnell"
  steps: 4                # 1-8: more steps = more detail, more neurons
  timeout_s: 30.0
  neurons_per_day: 10000  # the free allowance; 0 = no limit

search:
  # "Search the web for ..." -> Tavily (docs/results/search.md), run by GRACE's own code.
  # Needs TAVILY_API_KEY in .env. Free: 1,000 credits a month, no card; 1 credit per search.
  # Only the query is sent: never screen text or the conversation.
  enabled: true
  max_results: 3
  timeout_s: 8.0
  credits_per_month: 1000  # the free allowance; 0 = no limit
