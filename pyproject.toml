[project]
name = "grace"
version = "0.1.0"
description = "GRACE: multimodal (voice + hand gesture) desktop accessibility assistant for Windows"
readme = "README.md"
requires-python = "==3.11.*"
# M0 baseline: only what the CURRENT legacy code imports. New stack lands milestone by milestone
# (see docs/PLAN.md). Existing pins from the old requirements.txt are kept unchanged.
dependencies = [
    # main.py / grace/actions (input_ctl, screen) / screen_reader.py
    "pyautogui==0.9.54",
    "pyperclip==1.8.2",
    "keyboard==0.13.5 ; sys_platform == 'win32'",
    # tts.py
    "pyttsx3==2.90",
    # speech_recognition_module.py (sr.Microphone needs PyAudio)
    "SpeechRecognition==3.10.0",
    "PyAudio==0.2.13",
    "sounddevice==0.4.6",
    "soundfile==0.12.1",
    "numpy==1.24.3",
    "openai==1.3.0",
    # openai 1.3.0 passes `proxies=` to httpx, which httpx 0.28 removed.
    "httpx==0.27.2",
    # screen_reader.py / tesseract_check.py
    "pytesseract==0.3.10",
    "Pillow==9.5.0",
    "google-generativeai==0.3.1",
    # grace/input/gestures (legacy mp.solutions API) + grace/actions/system.py; pywin32 is unused
    # since Hand_Gesture.py was removed in M3 (kept: pins are only removed deliberately)
    "mediapipe==0.10.14",
    "screen-brightness-control==0.24.2",
    "pycaw==20240210 ; sys_platform == 'win32'",
    "comtypes==1.4.12 ; sys_platform == 'win32'",
    "pywin32==311 ; sys_platform == 'win32'",
    # grace/config.py (M1): .env keys + settings.yaml tunables. pydantic was already locked via openai.
    "pydantic==2.14.4",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.4",
    # grace/ui/overlay.py (M4): QtCore/QtGui/QtWidgets only; the Addons wheel is not needed.
    # abi3 wheel (cp310-abi3-win_amd64) installs on CPython 3.11. LGPL-3.0.
    "pyside6-essentials==6.11.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-mock==3.15.1",
    "pytest-qt==4.5.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
timeout = 60
markers = [
    "hardware: needs a real mic, camera, speakers or display (run manually on the base machine)",
    "network: makes real network calls",
    "windows: only runs on Windows",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Legacy modules are linted from M2 onward as they are replaced; new code must be clean.
extend-exclude = [
    "main.py",
    "screen_reader.py",
    "speech_recognition_module.py",
    "tts.py",
    "tesseract_check.py",
    "test_screen_reader.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
